group 'software.ragimov.flutterandroidutils'
version '1.0-SNAPSHOT'

// Gradle 9 / AGP 9: no buildscript block (AGP and Kotlin come from the app's settings.gradle) and no
// jcenter() - it no longer exists in Gradle 9. JitPack is only needed for MIUI-autostart and is declared
// for this project only instead of being pushed into every project of the app.
repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "software.ragimov.flutterandroidutils"

    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
        // no targetSdkVersion: deprecated for library modules (removed in AGP 9), the app decides
    }

}

dependencies {
    // kotlin-stdlib is added by the Kotlin Gradle plugin of the app
    implementation 'androidx.core:core-ktx:1.9.0'
    // checking Xiaomi Autostart https://github.com/XomaDev/MIUI-Autostart
    implementation 'com.github.XomaDev:MIUI-autostart:v1.3'
}
