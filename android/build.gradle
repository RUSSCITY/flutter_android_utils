group 'software.ragimov.flutterandroidutils'
version '1.0-SNAPSHOT'

// Gradle 9 / AGP 9: no buildscript block (AGP and Kotlin come from the app's settings.gradle) and no
// jcenter() - it no longer exists in Gradle 9.
repositories {
    google()
    mavenCentral()
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "software.ragimov.flutterandroidutils"

    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
        // no targetSdkVersion: deprecated for library modules (removed in AGP 9), the app decides
    }

}

dependencies {
    // kotlin-stdlib is added by the Kotlin Gradle plugin of the app
    implementation 'androidx.core:core-ktx:1.9.0'
    // No com.github.XomaDev:MIUI-autostart any more: it reads the MIUI autostart state through hidden
    // APIs (reflection), which Google Play rejects ("app uses unsupported APIs", ART on Android 16).
}
